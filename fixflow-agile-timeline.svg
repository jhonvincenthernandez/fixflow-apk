<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">FixFlow Agile development timeline</title>
  <desc id="desc">Agile phases and deliverables for the FixFlow Ionic Vue application using Firebase Data Connect GraphQL and PostgreSQL.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d5f31"/>
      <stop offset="1" stop-color="#168044"/>
    </linearGradient>
    <style>
      .head { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .month { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .week { font: 700 15px Arial, sans-serif; fill: #173a25; }
      .phase { font: 700 18px Arial, sans-serif; fill: #173a25; }
      .deliverable { font: 15px Arial, sans-serif; fill: #173a25; }
      .grid { stroke: #8ca497; stroke-width: 1.5; }
      .bar { fill: #1b984d; }
      .bar-dark { fill: #087838; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#f3f7f4"/>
  <rect x="34" y="34" width="1532" height="852" rx="14" fill="#ffffff" stroke="#688875" stroke-width="2"/>

  <!-- Header -->
  <rect x="34" y="34" width="1532" height="78" rx="14" fill="url(#header)"/>
  <rect x="34" y="78" width="1532" height="34" fill="url(#header)"/>
  <rect x="34" y="112" width="1532" height="62" fill="#dcefe1"/>
  <path d="M34 174 H1566" class="grid"/>
  <path d="M340 34 V886 M755 34 V886 M1566 34 V886" class="grid"/>
  <text x="187" y="82" text-anchor="middle" class="head">Agile Phase</text>
  <text x="548" y="70" text-anchor="middle" class="head">Key Activities &amp;</text>
  <text x="548" y="95" text-anchor="middle" class="head">Deliverables</text>
  <text x="1160" y="72" text-anchor="middle" class="month">October</text>
  <text x="1454" y="72" text-anchor="middle" class="month">November</text>

  <!-- Week columns -->
  <g class="grid">
    <path d="M755 112 V886 M860 112 V886 M965 112 V886 M1070 112 V886 M1175 112 V886 M1280 112 V886 M1385 112 V886 M1490 112 V886"/>
    <path d="M34 236 H1566 M34 298 H1566 M34 360 H1566 M34 422 H1566 M34 484 H1566 M34 546 H1566 M34 608 H1566 M34 670 H1566 M34 732 H1566 M34 794 H1566 M34 856 H1566"/>
  </g>
  <g text-anchor="middle" class="week">
    <text x="807" y="151">W1</text>
    <text x="912" y="151">W2</text>
    <text x="1017" y="151">W3</text>
    <text x="1122" y="151">W4</text>
    <text x="1227" y="151">W1</text>
    <text x="1332" y="151">W2</text>
    <text x="1437" y="151">W3</text>
    <text x="1528" y="151">W4</text>
  </g>

  <!-- Phase labels and deliverables -->
  <g class="phase">
    <text x="54" y="214">1. Plan</text>
    <text x="54" y="276">2. Design</text>
    <text x="54" y="338">3. Develop - Sprint 1</text>
    <text x="54" y="400">4. Develop - Sprint 2</text>
    <text x="54" y="462">5. Test</text>
    <text x="54" y="524">6. Deploy</text>
    <text x="54" y="586">7. Review</text>
    <text x="54" y="648">8. Presentation</text>
    <text x="54" y="710">9. Maintenance</text>
  </g>
  <g class="deliverable">
    <text x="356" y="207"><tspan x="356">Project plan, roles, and</tspan><tspan x="356" dy="20">FixFlow workflow definitions</tspan></text>
    <text x="356" y="269"><tspan x="356">Use-case diagram, system architecture,</tspan><tspan x="356" dy="20">and interface wireframes</tspan></text>
    <text x="356" y="331"><tspan x="356">Ionic + Vue setup, Data Connect,</tspan><tspan x="356" dy="20">GraphQL operations, PostgreSQL schema</tspan></text>
    <text x="356" y="393"><tspan x="356">Requests, quotations and revisions,</tspan><tspan x="356" dy="20">appointments, tracking, alerts, feedback</tspan></text>
    <text x="356" y="455"><tspan x="356">Role-based workflows, validation,</tspan><tspan x="356" dy="20">edge cases, and end-to-end testing</tspan></text>
    <text x="356" y="517"><tspan x="356">Environment configuration, Firebase</tspan><tspan x="356" dy="20">Data Connect, PostgreSQL, Android build</tspan></text>
    <text x="356" y="579"><tspan x="356">Software feedback, functional</tspan><tspan x="356" dy="20">validation, and issue correction</tspan></text>
    <text x="356" y="641"><tspan x="356">Final release, documentation,</tspan><tspan x="356" dy="20">and project presentation</tspan></text>
    <text x="356" y="703"><tspan x="356">Bug fixes, monitoring, data backup,</tspan><tspan x="356" dy="20">and future improvements</tspan></text>
  </g>

  <!-- Timeline bars -->
  <rect x="755" y="181" width="210" height="43" rx="5" class="bar-dark"/>
  <rect x="860" y="243" width="210" height="43" rx="5" class="bar"/>
  <rect x="965" y="305" width="210" height="43" rx="5" class="bar-dark"/>
  <rect x="1070" y="367" width="315" height="43" rx="5" class="bar"/>
  <rect x="1175" y="429" width="105" height="43" rx="5" class="bar-dark"/>
  <rect x="1280" y="491" width="105" height="43" rx="5" class="bar"/>
  <rect x="1385" y="553" width="105" height="43" rx="5" class="bar-dark"/>
  <rect x="1385" y="615" width="210" height="43" rx="5" class="bar"/>
  <rect x="1490" y="677" width="105" height="43" rx="5" class="bar-dark"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">
    <text x="860" y="208">Planning</text>
    <text x="965" y="270">Design</text>
    <text x="1070" y="332">Foundation</text>
    <text x="1227" y="394">Core FixFlow workflow</text>
    <text x="1227" y="456">Testing</text>
    <text x="1332" y="518">Deployment</text>
    <text x="1437" y="580">Review</text>
    <text x="1490" y="642">Release &amp; presentation</text>
    <text x="1542" y="704">Support</text>
  </g>

  <text x="800" y="835" class="deliverable">Actual FixFlow stack: Ionic + Vue → Firebase Data Connect (GraphQL) → PostgreSQL → Capacitor Android build</text>
</svg>
