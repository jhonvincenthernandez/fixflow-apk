# Read operations used by the FixFlow client.
# The client performs app-level password sign-in today, so these operations are
# PUBLIC. See the security section in README.md before using real customer data.

query CheckConnection @auth(
  level: PUBLIC
  insecureReason: "Read-only health check; returns no private app data."
) {
  appMetas(limit: 1) {
    key
  }
}

query GetFixflowUser($id: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: the client restores its session by reading the app user row."
) {
  fixflowUser(id: $id) {
    id
    role
    name
    email
    phone
    createdAt
  }
}

query GetFixflowUserForLogin($email: String!) @auth(
  level: PUBLIC
  insecureReason: "Public: email and password sign-in is handled by the client today; move it behind Firebase Auth before public launch."
) {
  fixflowUsers(where: { email: { eq: $email } }, limit: 1) {
    id
    role
    name
    email
    phone
    passwordHash
    salt
    iterations
    createdAt
  }
}

query ListFixflowUsersByRole($role: String!) @auth(
  level: PUBLIC
  insecureReason: "Public: the shop owner needs customer contact details; restrict this before public launch."
) {
  fixflowUsers(where: { role: { eq: $role } }) {
    id
    role
    name
    email
    phone
    createdAt
  }
}

query GetServiceRequest($id: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: request access is enforced in the client today; restrict this before public launch."
) {
  serviceRequest(id: $id) {
    id
    ref
    customerId
    serviceId
    itemName
    description
    mode
    address
    status
    quotationJson
    appointmentJson
    feedbackJson
    closureJson
    historyJson
    imageIdsJson
    createdAt
    updatedAt
  }
}

query ListAllServiceRequests @auth(
  level: PUBLIC
  insecureReason: "Public: the shop owner sees every request; restrict this before public launch."
) {
  serviceRequests(orderBy: [{ updatedAt: DESC }]) {
    id
    ref
    customerId
    serviceId
    itemName
    description
    mode
    address
    status
    quotationJson
    appointmentJson
    feedbackJson
    closureJson
    historyJson
    imageIdsJson
    createdAt
    updatedAt
  }
}

query ListServiceRequestsByCustomer($customerId: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: customers read requests by customer id; restrict this before public launch."
) {
  serviceRequests(where: { customerId: { eq: $customerId } }, orderBy: [{ updatedAt: DESC }]) {
    id
    ref
    customerId
    serviceId
    itemName
    description
    mode
    address
    status
    quotationJson
    appointmentJson
    feedbackJson
    closureJson
    historyJson
    imageIdsJson
    createdAt
    updatedAt
  }
}

query ListScheduledServiceRequests @auth(
  level: PUBLIC
  insecureReason: "Public: appointment times are needed to prevent double booking; restrict this before public launch."
) {
  serviceRequests(where: { status: { eq: "scheduled" } }) {
    id
    appointmentJson
    status
  }
}

query ListRequestImages($requestId: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: photos belong to a request; restrict this before public launch."
) {
  requestImages(where: { requestId: { eq: $requestId } }) {
    id
    requestId
    name
    mimeType
    dataUrl
  }
}

query GetNotification($id: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: notifications are read by their owning client today; restrict this before public launch."
) {
  notification(id: $id) {
    id
    userId
    requestId
    title
    body
    createdAt
    readAt
  }
}

query ListNotifications($userId: UUID!) @auth(
  level: PUBLIC
  insecureReason: "Public: notifications are read by their owning client today; restrict this before public launch."
) {
  notifications(where: { userId: { eq: $userId } }, orderBy: [{ createdAt: DESC }]) {
    id
    userId
    requestId
    title
    body
    createdAt
    readAt
  }
}

query GetAppMeta($key: String!) @auth(
  level: PUBLIC
  insecureReason: "Public: request counter and shop hours are shared settings; restrict this before public launch."
) {
  appMetas(where: { key: { eq: $key } }, limit: 1) {
    id
    key
    value
  }
}
