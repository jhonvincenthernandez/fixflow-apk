# Write operations used by the FixFlow client.
# The client performs app-level password sign-in today, so these operations are
# PUBLIC. See the security section in README.md before using real customer data.

mutation CreateFixflowUser(
  $id: UUID!
  $role: String!
  $name: String!
  $email: String!
  $phone: String!
  $passwordHash: String!
  $salt: String!
  $iterations: Int!
  $createdAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: account registration is handled by the client today; move it behind Firebase Auth before public launch."
) {
  fixflowUser_insert(data: {
    id: $id
    role: $role
    name: $name
    email: $email
    phone: $phone
    passwordHash: $passwordHash
    salt: $salt
    iterations: $iterations
    createdAt: $createdAt
  })
}

mutation CreateServiceRequest(
  $id: UUID!
  $ref: String!
  $customerId: UUID!
  $serviceId: String!
  $itemName: String!
  $description: String!
  $mode: String!
  $address: String!
  $status: String!
  $quotationJson: String
  $appointmentJson: String
  $feedbackJson: String
  $closureJson: String
  $historyJson: String!
  $imageIdsJson: String!
  $createdAt: Timestamp!
  $updatedAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: customers create requests from the client; restrict this before public launch."
) {
  serviceRequest_insert(data: {
    id: $id
    ref: $ref
    customerId: $customerId
    serviceId: $serviceId
    itemName: $itemName
    description: $description
    mode: $mode
    address: $address
    status: $status
    quotationJson: $quotationJson
    appointmentJson: $appointmentJson
    feedbackJson: $feedbackJson
    closureJson: $closureJson
    historyJson: $historyJson
    imageIdsJson: $imageIdsJson
    createdAt: $createdAt
    updatedAt: $updatedAt
  })
}

mutation UpdateServiceRequest(
  $id: UUID!
  $status: String!
  $quotationJson: String
  $appointmentJson: String
  $feedbackJson: String
  $closureJson: String
  $historyJson: String!
  $updatedAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: workflow actions update the request from the client; restrict this before public launch."
) {
  serviceRequest_update(id: $id, data: {
    status: $status
    quotationJson: $quotationJson
    appointmentJson: $appointmentJson
    feedbackJson: $feedbackJson
    closureJson: $closureJson
    historyJson: $historyJson
    updatedAt: $updatedAt
  })
}

mutation CreateRequestImage(
  $id: UUID!
  $requestId: UUID!
  $name: String!
  $mimeType: String!
  $dataUrl: String!
  $createdAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: customers attach photos from the client; restrict this before public launch."
) {
  requestImage_insert(data: {
    id: $id
    requestId: $requestId
    name: $name
    mimeType: $mimeType
    dataUrl: $dataUrl
    createdAt: $createdAt
  })
}

mutation CreateNotification(
  $id: UUID!
  $userId: UUID!
  $requestId: UUID!
  $title: String!
  $body: String!
  $createdAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: workflow events notify the other side of the request; restrict this before public launch."
) {
  notification_insert(data: {
    id: $id
    userId: $userId
    requestId: $requestId
    title: $title
    body: $body
    createdAt: $createdAt
  })
}

mutation MarkNotificationRead($id: UUID!, $readAt: Timestamp!) @auth(
  level: PUBLIC
  insecureReason: "Public: the owning client marks its notification as read today; restrict this before public launch."
) {
  notification_update(id: $id, data: { readAt: $readAt })
}

mutation CreateAppMeta($key: String!, $value: String!, $updatedAt: Timestamp!) @auth(
  level: PUBLIC
  insecureReason: "Public: shared settings such as the request counter live in PostgreSQL; restrict this before public launch."
) {
  appMeta_insert(data: { key: $key, value: $value, updatedAt: $updatedAt })
}

mutation UpdateAppMeta($id: UUID!, $value: String!, $updatedAt: Timestamp!) @auth(
  level: PUBLIC
  insecureReason: "Public: shared settings such as the request counter live in PostgreSQL; restrict this before public launch."
) {
  appMeta_update(id: $id, data: { value: $value, updatedAt: $updatedAt })
}

mutation CreateAppFeedback(
  $id: UUID!
  $rating: Int!
  $topic: String!
  $comment: String!
  $source: String!
  $platform: String!
  $createdAt: Timestamp!
) @auth(
  level: PUBLIC
  insecureReason: "Public: anonymous app feedback is submitted from the client; add App Check and rate limiting before public launch."
) {
  appFeedback_insert(data: {
    id: $id
    rating: $rating
    topic: $topic
    comment: $comment
    source: $source
    platform: $platform
    createdAt: $createdAt
  })
}
