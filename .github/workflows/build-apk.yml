name: Build FixFlow APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # 1. Download the source code from GitHub.
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. Install Node.js for Ionic/Vue.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"


      # 3. Install all dependencies from package-lock.json.
      - name: Install npm dependencies
        run: npm ci


      # 4. Create the Firebase .env file from GitHub Secret.
      # This allows Firebase to connect during the build.
      - name: Create Firebase environment file
        run: |
          printf '%s' "${{ secrets.FIREBASE_ENV }}" > .env


      # 5. Build the Ionic/Vue application.
      # This creates the latest dist folder.
      - name: Build Ionic application
        run: npm run build


      # 6. Install Java required for Android/Gradle.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"


      # 7. Synchronize the latest dist folder with Android.
      - name: Sync Capacitor Android
        run: npx cap sync android


      # 8. Allow Gradle to run on Linux.
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # 9. Build the Debug APK.
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # 10. Rename the generated APK.
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FixFlow.apk


      # 11. Upload the APK as a GitHub Actions artifact.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FixFlow-APK
          path: FixFlow.apk
          if-no-files-found: error
          retention-days: 30