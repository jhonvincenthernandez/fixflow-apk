name: Build FixFlow APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Create Firebase environment file
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          if [ -z "$FIREBASE_ENV" ]; then
            echo "::error::FIREBASE_ENV repository secret is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_ENV" > .env

      - name: Lint application
        run: npm run lint

      - name: Run unit tests
        run: npx vitest run

      - name: Build Ionic application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "::error::All four Android signing secrets are required for a release build."
              exit 1
            fi

            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fixflow-release.jks
            printf 'storeFile=fixflow-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: env.SIGNED == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: env.SIGNED != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/FixFlow-release.apk
            echo "APK_NAME=FixFlow-release.apk" >> "$GITHUB_ENV"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FixFlow-debug.apk
            echo "APK_NAME=FixFlow-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FixFlow-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "### FixFlow APK"
            echo ""
            echo "- File: \`$APK_NAME\`"
            echo "- Signing: \`$SIGNED\`"
            echo ""
            echo "Download the APK from the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
