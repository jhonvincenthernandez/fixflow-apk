<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">FixFlow use-case diagram</title>
  <desc id="desc">Use-case diagram showing customer and business owner actions in the FixFlow service request, quotation, appointment, and tracking workflow.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123b5d"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#123b5d" flood-opacity=".14"/>
    </filter>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #ffffff; letter-spacing: .8px; }
      .actor { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .usecase { font: 600 15px Arial, sans-serif; fill: #17324d; }
      .note { font: 14px Arial, sans-serif; fill: #536b7d; }
      .system { fill: #ffffff; stroke: #b7c8d3; stroke-width: 2; }
      .oval { fill: #f5fafc; stroke: #176b87; stroke-width: 2; }
      .line { stroke: #6d8492; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="#f3f7f9"/>
  <rect x="28" y="24" width="1444" height="932" rx="26" fill="#ffffff" stroke="#d7e3e9" stroke-width="2"/>
  <rect x="28" y="24" width="1444" height="75" rx="26" fill="url(#header)"/>
  <rect x="28" y="70" width="1444" height="29" fill="url(#header)"/>
  <text x="750" y="72" text-anchor="middle" class="title">FIXFLOW USE-CASE DIAGRAM</text>

  <rect x="222" y="126" width="1056" height="766" rx="22" class="system" filter="url(#shadow)"/>
  <text x="750" y="164" text-anchor="middle" class="actor">FixFlow: Service Request, Quotation, Appointment, and Tracking Platform</text>

  <!-- Actors -->
  <g transform="translate(104 440)">
    <circle cx="0" cy="-34" r="18" fill="#176b87"/>
    <path d="M-31 34 Q0 -3 31 34" fill="none" stroke="#176b87" stroke-width="11" stroke-linecap="round"/>
    <text x="0" y="70" text-anchor="middle" class="actor">Customer</text>
  </g>
  <g transform="translate(1396 440)">
    <circle cx="0" cy="-34" r="18" fill="#176b87"/>
    <path d="M-31 34 Q0 -3 31 34" fill="none" stroke="#176b87" stroke-width="11" stroke-linecap="round"/>
    <text x="0" y="70" text-anchor="middle" class="actor">Business Owner</text>
    <text x="0" y="92" text-anchor="middle" class="actor">/ Admin</text>
  </g>

  <!-- Customer use cases -->
  <g class="oval">
    <ellipse cx="405" cy="216" rx="135" ry="31"/>
    <ellipse cx="405" cy="294" rx="135" ry="31"/>
    <ellipse cx="405" cy="372" rx="135" ry="31"/>
    <ellipse cx="405" cy="450" rx="135" ry="31"/>
    <ellipse cx="405" cy="528" rx="135" ry="31"/>
    <ellipse cx="405" cy="606" rx="135" ry="31"/>
    <ellipse cx="405" cy="684" rx="135" ry="31"/>
    <ellipse cx="405" cy="762" rx="135" ry="31"/>
    <ellipse cx="405" cy="840" rx="135" ry="31"/>
  </g>
  <g text-anchor="middle" class="usecase">
    <text x="405" y="211"><tspan x="405">Create account</tspan><tspan x="405" dy="19">and sign in</tspan></text>
    <text x="405" y="289"><tspan x="405">Run quick</tspan><tspan x="405" dy="19">repair check</tspan></text>
    <text x="405" y="367"><tspan x="405">View services and</tspan><tspan x="405" dy="19">submit request/photos</tspan></text>
    <text x="405" y="445"><tspan x="405">Review, accept, decline,</tspan><tspan x="405" dy="19">or request revision</tspan></text>
    <text x="405" y="523"><tspan x="405">Book an appointment</tspan><tspan x="405" dy="19">after quotation acceptance</tspan></text>
    <text x="405" y="601"><tspan x="405">Reschedule or cancel</tspan><tspan x="405" dy="19">an appointment</tspan></text>
    <text x="405" y="679"><tspan x="405">Track service status and</tspan><tspan x="405" dy="19">view request history</tspan></text>
    <text x="405" y="757"><tspan x="405">Submit service feedback</tspan><tspan x="405" dy="19">and app feedback</tspan></text>
    <text x="405" y="835"><tspan x="405">View alerts and</tspan><tspan x="405" dy="19">manage profile</tspan></text>
  </g>

  <!-- Owner use cases -->
  <g class="oval">
    <ellipse cx="1095" cy="216" rx="135" ry="31"/>
    <ellipse cx="1095" cy="294" rx="135" ry="31"/>
    <ellipse cx="1095" cy="372" rx="135" ry="31"/>
    <ellipse cx="1095" cy="450" rx="135" ry="31"/>
    <ellipse cx="1095" cy="528" rx="135" ry="31"/>
    <ellipse cx="1095" cy="606" rx="135" ry="31"/>
    <ellipse cx="1095" cy="684" rx="135" ry="31"/>
    <ellipse cx="1095" cy="762" rx="135" ry="31"/>
    <ellipse cx="1095" cy="840" rx="135" ry="31"/>
  </g>
  <g text-anchor="middle" class="usecase">
    <text x="1095" y="211"><tspan x="1095">Sign in and</tspan><tspan x="1095" dy="19">manage profile</tspan></text>
    <text x="1095" y="289"><tspan x="1095">Review requests and</tspan><tspan x="1095" dy="19">uploaded images</tspan></text>
    <text x="1095" y="367"><tspan x="1095">Prepare and send</tspan><tspan x="1095" dy="19">quotations</tspan></text>
    <text x="1095" y="445"><tspan x="1095">Review revision requests</tspan><tspan x="1095" dy="19">and resend quotations</tspan></text>
    <text x="1095" y="523"><tspan x="1095">Manage shop availability,</tspan><tspan x="1095" dy="19">booking rules, and slots</tspan></text>
    <text x="1095" y="601"><tspan x="1095">Reschedule scheduled</tspan><tspan x="1095" dy="19">appointments with a reason</tspan></text>
    <text x="1095" y="679"><tspan x="1095">Start service and</tspan><tspan x="1095" dy="19">update repair progress</tspan></text>
    <text x="1095" y="757"><tspan x="1095">Complete service and</tspan><tspan x="1095" dy="19">view customer feedback</tspan></text>
    <text x="1095" y="835"><tspan x="1095">View alerts and cancel</tspan><tspan x="1095" dy="19">service requests</tspan></text>
  </g>

  <!-- Actor associations -->
  <g class="line">
    <path d="M122 406 C185 360 202 216 270 216"/>
    <path d="M122 406 C185 385 206 294 270 294"/>
    <path d="M122 406 C185 410 206 372 270 372"/>
    <path d="M122 406 H270"/>
    <path d="M122 406 C185 430 206 528 270 528"/>
    <path d="M122 406 C185 475 206 606 270 606"/>
    <path d="M122 406 C185 520 206 684 270 684"/>
    <path d="M122 406 C185 565 206 762 270 762"/>
    <path d="M122 406 C185 610 210 840 270 840"/>
    <path d="M1378 406 C1320 360 1298 216 1230 216"/>
    <path d="M1378 406 C1320 385 1298 294 1230 294"/>
    <path d="M1378 406 C1320 410 1298 372 1230 372"/>
    <path d="M1378 406 H1230"/>
    <path d="M1378 406 C1320 430 1298 528 1230 528"/>
    <path d="M1378 406 C1320 475 1298 606 1230 606"/>
    <path d="M1378 406 C1320 520 1298 684 1230 684"/>
    <path d="M1378 406 C1320 565 1298 762 1230 762"/>
    <path d="M1378 406 C1320 610 1290 840 1230 840"/>
  </g>

  <text x="750" y="930" text-anchor="middle" class="note">All listed use cases are based on the current FixFlow workflow and implemented application features.</text>
</svg>
