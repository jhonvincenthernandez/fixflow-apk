<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">FixFlow system architecture</title>
  <desc id="desc">Architecture flow from users through the Ionic Vue interface and Firebase Data Connect GraphQL API to FixFlow modules and PostgreSQL.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123b5d"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#123b5d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#176b87"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .section { font: 700 18px Arial, sans-serif; fill: #123b5d; letter-spacing: .8px; }
      .label { font: 600 16px Arial, sans-serif; fill: #17324d; }
      .body { font: 15px Arial, sans-serif; fill: #41576a; }
      .small { font: 13px Arial, sans-serif; fill: #536b7d; }
      .card { fill: #ffffff; stroke: #b7c8d3; stroke-width: 2; }
      .module { fill: #f5fafc; stroke: #b7c8d3; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f3f7f9"/>
  <rect x="36" y="28" width="1528" height="704" rx="28" fill="#ffffff" stroke="#d7e3e9" stroke-width="2"/>

  <rect x="36" y="28" width="1528" height="72" rx="28" fill="url(#header)"/>
  <rect x="36" y="72" width="1528" height="28" fill="url(#header)"/>
  <text x="800" y="73" text-anchor="middle" class="title">FIXFLOW SYSTEM ARCHITECTURE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="156" width="190" height="300" rx="18" class="card"/>
    <rect x="292" y="156" width="220" height="300" rx="18" class="card"/>
    <rect x="544" y="156" width="250" height="300" rx="18" class="card"/>
    <rect x="826" y="132" width="450" height="348" rx="18" class="card"/>
    <rect x="1308" y="156" width="220" height="300" rx="18" class="card"/>
  </g>

  <text x="165" y="194" text-anchor="middle" class="section">USERS</text>
  <circle cx="165" cy="248" r="25" fill="#176b87"/>
  <circle cx="165" cy="238" r="10" fill="#ffffff"/>
  <path d="M145 266 Q165 246 185 266" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="165" y="310" text-anchor="middle" class="label">Customer</text>
  <circle cx="165" cy="355" r="25" fill="#176b87"/>
  <circle cx="165" cy="345" r="10" fill="#ffffff"/>
  <path d="M145 373 Q165 353 185 373" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="165" y="417" text-anchor="middle" class="label">Service Provider</text>
  <text x="165" y="438" text-anchor="middle" class="small">Business Owner / Admin</text>

  <text x="402" y="194" text-anchor="middle" class="section">INTERFACE</text>
  <rect x="367" y="224" width="70" height="108" rx="8" fill="#176b87"/>
  <rect x="374" y="235" width="56" height="78" rx="3" fill="#ffffff"/>
  <circle cx="402" cy="322" r="4" fill="#ffffff"/>
  <text x="402" y="365" text-anchor="middle" class="label">Mobile App</text>
  <rect x="352" y="390" width="100" height="58" rx="5" fill="#176b87"/>
  <rect x="360" y="398" width="84" height="38" fill="#ffffff"/>
  <text x="402" y="474" text-anchor="middle" class="body">Ionic + Vue</text>
  <text x="402" y="495" text-anchor="middle" class="small">Web Interface</text>

  <text x="669" y="194" text-anchor="middle" class="section">FIREBASE DATA CONNECT</text>
  <circle cx="669" cy="257" r="34" fill="#176b87"/>
  <path d="M654 265 L669 222 L685 265 L669 258 Z" fill="#ffffff"/>
  <text x="669" y="331" text-anchor="middle" class="label">GraphQL API</text>
  <text x="669" y="360" text-anchor="middle" class="body">Generated TypeScript SDK</text>
  <text x="669" y="389" text-anchor="middle" class="body">Role-based Validation</text>
  <rect x="580" y="417" width="178" height="30" rx="15" fill="#e2f2f5"/>
  <text x="669" y="438" text-anchor="middle" class="small">HTTPS / GraphQL</text>

  <text x="1051" y="166" text-anchor="middle" class="section">FIXFLOW MODULES</text>
  <g>
    <rect x="850" y="190" width="126" height="70" rx="10" class="module"/>
    <rect x="988" y="190" width="126" height="70" rx="10" class="module"/>
    <rect x="1126" y="190" width="126" height="70" rx="10" class="module"/>
    <rect x="850" y="274" width="126" height="70" rx="10" class="module"/>
    <rect x="988" y="274" width="126" height="70" rx="10" class="module"/>
    <rect x="1126" y="274" width="126" height="70" rx="10" class="module"/>
    <rect x="850" y="358" width="126" height="70" rx="10" class="module"/>
    <rect x="988" y="358" width="126" height="70" rx="10" class="module"/>
    <rect x="1126" y="358" width="126" height="70" rx="10" class="module"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="913" y="218"><tspan x="913">Login and</tspan><tspan x="913" dy="20">Registration</tspan></text>
    <text x="1051" y="218"><tspan x="1051">User</tspan><tspan x="1051" dy="20">Accounts</tspan></text>
    <text x="1189" y="218"><tspan x="1189">Service</tspan><tspan x="1189" dy="20">Catalog</tspan></text>
    <text x="913" y="302"><tspan x="913">Service</tspan><tspan x="913" dy="20">Requests</tspan></text>
    <text x="1051" y="302">Quotations</text>
    <text x="1189" y="302">Appointments</text>
    <text x="913" y="386"><tspan x="913">Service</tspan><tspan x="913" dy="20">Tracking</tspan></text>
    <text x="1051" y="386">Notifications</text>
    <text x="1189" y="386"><tspan x="1189">History and</tspan><tspan x="1189" dy="20">Feedback</tspan></text>
  </g>
  <rect x="911" y="444" width="280" height="26" rx="13" fill="#e2f2f5"/>
  <text x="1051" y="462" text-anchor="middle" class="small">Role-based Access / Input Validation</text>

  <text x="1418" y="194" text-anchor="middle" class="section">DATABASE</text>
  <ellipse cx="1418" cy="248" rx="53" ry="18" fill="#176b87"/>
  <path d="M1365 248 V326 C1365 347 1471 347 1471 326 V248" fill="#176b87"/>
  <ellipse cx="1418" cy="326" rx="53" ry="18" fill="#176b87"/>
  <path d="M1370 270 C1388 284 1448 284 1466 270 M1370 298 C1388 312 1448 312 1466 298" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="1418" y="380" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1418" y="414" text-anchor="middle" class="body">Users</text>
  <text x="1418" y="436" text-anchor="middle" class="body">Requests and Appointments</text>
  <text x="1418" y="458" text-anchor="middle" class="small">Notifications, Feedback, Data</text>

  <g stroke="#176b87" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M260 306 H285"/>
    <path d="M512 306 H537"/>
    <path d="M794 306 H819"/>
    <path d="M1276 306 H1301"/>
  </g>
  <text x="273" y="288" text-anchor="middle" class="small">User flow</text>
  <text x="525" y="288" text-anchor="middle" class="small">HTTPS</text>
  <text x="806" y="288" text-anchor="middle" class="small">Data Connect</text>
  <text x="1289" y="288" text-anchor="middle" class="small">SQL</text>

  <text x="800" y="680" text-anchor="middle" class="small">FixFlow: service requests, quotations, appointments, tracking, notifications, and customer feedback</text>
</svg>
